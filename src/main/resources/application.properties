spring.application.name=LogiTrack

spring.datasource.url=jdbc:mysql://localhost:3306/logitrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=WGSL2@NO2002cc
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# ===== Actuator / Monitoring =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=logitrack
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.info.env.enabled=true

info.app.name=LogiTrack
info.app.description=API de gestion logistique
info.app.version=1.0.0

# ===== Logging =====
logging.file.name=./logs/logitrack.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.logitrack=DEBUG